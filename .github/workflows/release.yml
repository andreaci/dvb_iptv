name: Release self-contained application

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      should-release: ${{ steps.version.outputs.found }}
    steps:
      - name: Read version from commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          version="$(printf '%s\n' "$COMMIT_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [[ -n "$version" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "value=$version" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No semantic version found; release skipped."
          fi

  release:
    needs: detect-version
    if: needs.detect-version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
      ARCHIVE_NAME: DvbServer-${{ needs.detect-version.outputs.version }}-win-x64.zip
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Detect existing tag
        id: tag
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $remoteTag = @(git ls-remote --tags origin "refs/tags/$env:VERSION")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query tags from origin."
          }
          $exists = $remoteTag.Count -gt 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) {
            Write-Host "Tag $env:VERSION exists; its release asset will be rebuilt."
          } else {
            Write-Host "Tag $env:VERSION does not exist and will be created."
          }

      - name: Build the existing tagged commit
        if: steps.tag.outputs.exists == 'true'
        shell: pwsh
        run: |
          git checkout --detach "refs/tags/$env:VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out tag $env:VERSION."
          }

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish DvbServer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            --output release-package
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

      - name: Create ready-to-run archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release-package\*" -DestinationPath $env:ARCHIVE_NAME -Force

      - name: Create and push tag
        if: steps.tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:VERSION -m "Release $env:VERSION" $env:GITHUB_SHA
          git push origin $env:VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push tag $env:VERSION."
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:VERSION *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:VERSION $env:ARCHIVE_NAME --clobber
          } else {
            gh release create $env:VERSION $env:ARCHIVE_NAME `
              --title $env:VERSION `
              --generate-notes `
              --verify-tag
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish GitHub Release $env:VERSION."
          }
