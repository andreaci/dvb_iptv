name: Release self-contained application

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      should-release: ${{ steps.version.outputs.found }}
    steps:
      - name: Read version from commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          version="$(printf '%s\n' "$COMMIT_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [[ -n "$version" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            echo "value=${version#v}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No semantic version found; release skipped."
          fi

  release:
    needs: detect-version
    if: needs.detect-version.outputs.should-release == 'true'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.detect-version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
      ARCHIVE_NAME: DvbServer-${{ needs.detect-version.outputs.tag }}-win-x64.zip
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect existing tag
        id: tag
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $remoteTag = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query tags from origin."
          }
          $exists = $remoteTag.Count -gt 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) {
            Write-Host "Tag $env:RELEASE_TAG exists; its release asset will be rebuilt."
          } else {
            Write-Host "Tag $env:RELEASE_TAG does not exist and will be created."
          }

      - name: Build the existing tagged commit
        if: steps.tag.outputs.exists == 'true'
        shell: pwsh
        run: |
          git checkout --detach "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out tag $env:RELEASE_TAG."
          }

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
          architecture: x64

      - name: Pin and verify the selected SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "10.0.302",
              "rollForward": "disable",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content -LiteralPath global.json -Encoding utf8

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          '@ | Set-Content -LiteralPath NuGet.Config -Encoding utf8

          $selectedSdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $selectedSdk.Trim() -ne "10.0.302") {
            throw "Expected .NET SDK 10.0.302, but selected '$selectedSdk'."
          }
          dotnet --info

      - name: Restore Windows runtime dependencies
        shell: pwsh
        run: |
          dotnet restore DvbServer.csproj `
            --runtime win-x64 `
            --verbosity normal `
            --configfile NuGet.Config `
            -p:Version=$env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed with exit code $LASTEXITCODE."
          }

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish DvbServer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$env:RELEASE_VERSION `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            --output release-package
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

      - name: Create ready-to-run archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release-package\*" -DestinationPath $env:ARCHIVE_NAME -Force

      - name: Create and push tag
        if: steps.tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG -m "Release $env:RELEASE_TAG" $env:GITHUB_SHA
          git push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push tag $env:RELEASE_TAG."
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $env:ARCHIVE_NAME --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:ARCHIVE_NAME `
              --title $env:RELEASE_TAG `
              --generate-notes `
              --verify-tag
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish GitHub Release $env:RELEASE_TAG."
          }
