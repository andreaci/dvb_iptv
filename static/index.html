<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dvb</title>

  <script src="assets/vendor/hls/hls.min.js"></script>
  <script src="assets/vendor/dashjs/dash.all.min.js"></script>
  <script src="assets/vendor/socket.io/socket.io.min.js"></script>

  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/vendor/manrope/manrope.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="video-container">
    
    <video id="videoPlayer" autoplay playsinline poster="assets/radio.jpg"></video>
  </div>

  <div id="uiOverlay" class="ui-wrapper">

    <!-- ✅ SOLO: wrapper scalabile -->
    <div class="ui-stage">

      <aside class="sidebar">

        <div class="country-picker">
          <label for="countrySelect">Paese</label>
          <div class="country-select-wrap">
            <select id="countrySelect" aria-label="Seleziona il paese"></select>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </div>
          <div id="dataStatus" class="data-status" role="status" aria-live="polite"></div>
		  <br />
        <div class="channel-search">
		  <i class="fa-solid fa-magnifying-glass"></i>
		  <input type="text" id="channelSearch" placeholder="Cerca">
		</div>
        </div>
        <!-- HEADER FISSO 
        <div class="sidebar-header">
          <div class="sidebar-header-left">
            <img id="activeLogo" src="" style="display:none">
            <h1 id="activeName">Lampone TV</h1>
          </div>
        </div>-->

        <!-- CATEGORIE FISSE -->
        <div class="sidebar-cats-fixed">
          <div class="section-label">Categorie</div>
          <div id="categoryContainer" class="sidebar-cats"></div>

          <div class="section-label">Canali</div>
        </div>

        <!-- SOLO CANALI SCORRONO -->
        <div class="sidebar-chans-scroll">
          <div id="channelContainer"></div>
        </div>

      </aside>

      <div class="epg-overlay">
        <div class="epg-card">
          <div class="epg-content">
            <div class="epg-now">

             <!-- <span class="label1">ORA IN ONDA SU <span style="color:#FFFFFF91;"id="activeName"></span></span> -->
             <h2 id="epgNowText"> Seleziona un canale</h2>
             <div id="playerStatus" class="player-status" role="status" aria-live="polite"></div>

              <div class="progress-bar">
                <div id="epgNowFill" class="progress-fill"></div>
              </div>

              <div class="player-controls">

                <button class="icon-btn" onclick="rewind()" aria-label="Indietro 10 secondi">
                  <i class="fa-solid fa-rotate-left"></i>
                </button>

                <button class="icon-btn" id="playPauseBtn" onclick="togglePlay()" aria-label="Pausa">
                  <i class="fa-solid fa-pause"></i>
                </button>

                <button class="icon-btn" onclick="forward()" aria-label="Avanti 10 secondi">
                  <i class="fa-solid fa-rotate-right"></i>
                </button>

                <div class="volume-container">
                  <span class="label vol-label">VOL</span>
                  <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
                  <span class="label vol-label" id="volLevel"></span>
				  
                </div>

                <div id="qualityBadge" class="quality-badge"></div>


                <button class="icon-btn" onclick="toggleFullScreen()" aria-label="Schermo intero" style="margin-left:auto">
                  <i class="fa-solid fa-expand"></i>
                </button>
              </div>
            </div>

            <div class="epg-next">
          
              <span class="label2"><i style="color:#ffc271; font-size: 18px;" class="fa-duotone fa-solid fa-clock fa-shake"></i> A SEGUIRE</span>
              <p></p>
              <p></p>
              <div id="epgNextList"></div>
            </div>
          </div>
         
        </div>
      
          <p class="version">2026 © lampone </p>
      </div>



      <div class="video-controls-hint">
        

        <i id="channelTypeIcon"></i><div id="groupCount"></div>

      </div>

    </div>
  </div>

  <script src="scripts.js?v=4"></script>
</body>
</html>
